name: build-ios-rn

# Reusable: build the React Native PulsarApp on iOS Simulator. By default it
# builds against the local Pulsar iOS sources (via USE_LOCAL_PULSAR_IOS, which
# flips the pod install to the local podspec); pass use_local_pulsar_ios: false
# to build against the published PulsarHaptics pod instead. Called from
# test-build-apps.yml.

on:
  workflow_call:
    inputs:
      build_type:
        description: 'debug | release'
        required: true
        type: string
      use_local_pulsar:
        description: 'Build against local iOS/Pulsar sources (true) or the published PulsarHaptics pod (false)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: react-native/PulsarApp

      - name: Install RN library deps and build TS output
        working-directory: react-native/react-native-pulsar
        run: |
          npm ci
          npm run build

      - name: Install example app JS deps
        working-directory: react-native/PulsarApp
        run: npm ci

      - name: Verify Pulsar invocation in app sources
        run: |
          if ! grep -qrE "from ['\"]react-native-pulsar['\"]" react-native/PulsarApp/src react-native/PulsarApp/App.tsx; then
            echo "::error::No react-native-pulsar import found in RN PulsarApp sources." >&2
            exit 1
          fi

      - name: Install pods (local Pulsar iOS sources = ${{ inputs.use_local_pulsar }})
        working-directory: react-native/PulsarApp/ios
        env:
          USE_LOCAL_PULSAR_IOS: ${{ inputs.use_local_pulsar && '1' || '0' }}
        run: bundle exec pod install

      - name: Build React Native iOS example app
        working-directory: react-native/PulsarApp/ios
        run: |
          CONFIG=$( [[ "${{ inputs.build_type }}" == "release" ]] && echo "Release" || echo "Debug" )
          xcodebuild \
            -workspace example.xcworkspace \
            -scheme example \
            -configuration "$CONFIG" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
