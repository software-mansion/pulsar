name: publish-web-haptics

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (auto resolves latest vs legacy from the version)'
        required: false
        type: choice
        options:
          - auto
          - latest
          - legacy
          - rc
          - beta
        default: 'auto'
      dry-run:
        description: 'Dry run'
        required: false
        type: boolean
        default: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: web/Pulsar
        run: npm ci

      - name: Run tests
        working-directory: web/Pulsar
        run: npm test

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          VERSION="$(node -p "require('./sdk-versions.json').web.version")"

          if [[ -z "$VERSION" ]]; then
            echo "Release version could not be determined from sdk-versions.json." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION (from sdk-versions.json)"

      - name: Publish stable
        uses: software-mansion/npm-package-publish@d62244c0680bfda13644957dd83c85bd5cbb38d0
        with:
          package-name: pulsar-haptics
          package-json-path: web/Pulsar/package.json
          release-type: stable
          version: ${{ steps.release.outputs.version }}
          npm-tag: ${{ github.event.inputs.tag != 'auto' && github.event.inputs.tag || '' }}
          release-mode: stage
          dry-run: ${{ github.event.inputs.dry-run || 'true' }}
          install-dependencies-command: npm ci
