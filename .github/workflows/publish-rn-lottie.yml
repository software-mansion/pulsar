name: publish-rn-lottie

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (auto resolves latest vs legacy from the version)'
        required: false
        type: choice
        options:
          - auto
          - latest
          - legacy
          - rc
        default: 'auto'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          VERSION="$(node -p "require('./sdk-versions.json').reactNativeLottie.version")"

          if [[ -z "$VERSION" ]]; then
            echo "Release version could not be determined from sdk-versions.json." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION (from sdk-versions.json)"

      - name: Publish stable
        uses: software-mansion/npm-package-publish@d62244c0680bfda13644957dd83c85bd5cbb38d0
        with:
          package-name: react-native-pulsar-lottie
          package-json-path: react-native/react-native-pulsar-lottie/package.json
          release-type: stable
          version: ${{ steps.release.outputs.version }}
          npm-tag: ${{ github.event.inputs.tag != 'auto' && github.event.inputs.tag || '' }}
          release-mode: stage
          dry-run: 'false'
          install-dependencies-command: npm install
