name: Test iOS SDK

# Runs the iOS Pulsar Swift Package test suite on any change to the SDK
# sources (iOS/Pulsar/**). The package imports UIKit, so it cannot be built
# for the macOS host — the tests must run against an iOS Simulator via
# xcodebuild. On the simulator CHHapticEngine reports haptics unsupported, so
# the suite covers construction, data transforms, line/curve geometry, preset
# resolution/caching and audio buffer rendering (not real haptic playback).

on:
  push:
    branches:
      - main
    paths:
      - 'iOS/Pulsar/**'
      - '.github/workflows/test-ios-sdk.yml'
  pull_request:
    paths:
      - 'iOS/Pulsar/**'
      - '.github/workflows/test-ios-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available \
            | grep -E "iPhone [0-9]+" \
            | grep -oE "[0-9A-F]{8}-[0-9A-F-]{27}" \
            | head -1)
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator found on the runner." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Main suites — real behavior on the simulator. Excludes the CoreHaptics mock suite,
      # which swizzles CoreHaptics process-wide and must not race the real-behavior assertions.
      # `Pulsar-Package`, not `Pulsar`: once the package gained plugin/executable products, SPM
      # started emitting a scheme per product, and only the package-level scheme carries the test
      # action. `-scheme Pulsar` is the library product and fails with "not currently configured
      # for the test action".
      - name: Run Pulsar package tests
        working-directory: iOS/Pulsar
        run: |
          xcodebuild test \
            -scheme Pulsar-Package \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            -skip-testing:PulsarTests/CoreHapticsMockTests \
            -resultBundlePath TestResults.xcresult

      # CoreHaptics mock suite — swizzles CHHapticEngine to verify the wrapper's interaction with
      # CoreHaptics. Run in isolation so the global swizzle can't affect the suites above.
      - name: Run CoreHaptics mock suite (isolated)
        working-directory: iOS/Pulsar
        run: |
          xcodebuild test \
            -scheme Pulsar-Package \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            -only-testing:PulsarTests/CoreHapticsMockTests \
            -resultBundlePath MockTestResults.xcresult

      - name: Upload test result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            iOS/Pulsar/TestResults.xcresult
            iOS/Pulsar/MockTestResults.xcresult
          if-no-files-found: ignore
