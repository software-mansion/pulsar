name: Publish iOS Lottie to CocoaPods

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-latest
    env:
      COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install CocoaPods
        run: gem install cocoapods -v 1.16.2

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          VERSION="$(ruby -rjson -e 'puts JSON.parse(File.read("sdk-versions.json")).fetch("iosLottie").fetch("version")')"

          if [[ -z "$VERSION" ]]; then
            echo "Release version could not be determined from sdk-versions.json." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION (from sdk-versions.json)"

      - name: Verify podspec version metadata
        shell: bash
        run: |
          EXPECTED_VERSION="${{ steps.release.outputs.version }}"
          PODSPEC_VERSION="$(sed -n "s/.*s\\.version[[:space:]]*=[[:space:]]*'\\([^']*\\)'.*/\\1/p" iOS/PulsarLottie/PulsarLottie.podspec | head -n 1)"

          if [[ "$PODSPEC_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "PulsarLottie.podspec version ($PODSPEC_VERSION) does not match sdk-versions.json version ($EXPECTED_VERSION)." >&2
            exit 1
          fi

      - name: Verify CocoaPods token
        shell: bash
        run: |
          if [[ -z "${COCOAPODS_TRUNK_TOKEN:-}" ]]; then
            echo "Missing COCOAPODS_TRUNK_TOKEN secret." >&2
            exit 1
          fi

      - name: Lint podspec
        working-directory: iOS/PulsarLottie
        run: pod spec lint PulsarLottie.podspec --allow-warnings

      - name: Publish to CocoaPods Trunk
        working-directory: iOS/PulsarLottie
        run: pod trunk push PulsarLottie.podspec --allow-warnings
