name: Publish pulsar-gen Gradle plugin to Maven

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # The plugin is its own standalone build; the app's wrapper drives it via -p.
      - name: Execute Gradle build
        run: Android/PulsarApp/gradlew -p tools/pulsar-gen-gradle build

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # Publishes both the implementation jar (com.swmansion.pulsar:pulsar-gen-gradle) and the
      # plugin marker (com.swmansion.pulsar.gen) that `plugins { id(...) }` resolves.
      - name: Publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: Android/PulsarApp/gradlew -p tools/pulsar-gen-gradle nmcpPublishAllPublicationsToCentralPortal
