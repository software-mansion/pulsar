# Verification profile: mobile, level standard (set up with /factory:setup on 2026-11-17).
# This file decides what "done" means (`factory check`). Agents may not edit it; review changes like code.
# The repo is a multi-SDK monorepo with no root test runner: every verifier is scoped to one package by `paths`,
# so a task only pays for the packages it touches.
schema: factory.profile/v1
profiles:
  - mobile
verifiers:
  # --- react-native/react-native-pulsar (RN SDK) ---
  - id: rn-typecheck
    kind: typecheck
    run: cd react-native/react-native-pulsar && npx tsc --noEmit
    paths: ["react-native/react-native-pulsar/src/**", "react-native/react-native-pulsar/tsconfig*.json"]
    required: true
    quick: true
    timeout_s: 300
    parse: exit
  - id: rn-lint
    kind: lint
    # Changed files only: main carries ~230 pre-existing eslint errors (mostly prettier) across the package.
    run: .factory/verification/checks/eslint-changed.sh react-native/react-native-pulsar
    paths: ["react-native/react-native-pulsar/**/*.{js,jsx,ts,tsx,mjs}"]
    required: true
    quick: true
    timeout_s: 300
    parse: exit
  - id: rn-unit
    kind: unit
    run: >-
      mkdir -p .factory-out && cd react-native/react-native-pulsar &&
      (npx jest --ci --coverage --coverageReporters=lcov --coverageDirectory="$OLDPWD/.factory-out/rn-coverage") > "$OLDPWD/.factory-out/rn-unit.log" 2>&1;
      s=$?; cat "$OLDPWD/.factory-out/rn-unit.log"; exit $s
    paths: ["react-native/react-native-pulsar/src/**", "react-native/react-native-pulsar/jest-mock.js", "react-native/react-native-pulsar/package.json"]
    required: true
    quick: true
    timeout_s: 600
    parse: exit
    evidence:
      - { kind: test-report, glob: .factory-out/rn-unit.log }
      - { kind: coverage, glob: .factory-out/rn-coverage/lcov.info }

  # --- react-native/react-native-pulsar-lottie ---
  - id: rn-lottie-unit
    kind: unit
    run: cd react-native/react-native-pulsar-lottie && npm test
    paths: ["react-native/react-native-pulsar-lottie/src/**", "react-native/react-native-pulsar-lottie/package.json"]
    required: true
    quick: true
    timeout_s: 300
    parse: exit
  - id: rn-lottie-typecheck
    kind: typecheck
    # Not required: fails on main (2026-11-17). The package type-checks against the published react-native-pulsar
    # (^1.6.1), which lacks `PresetHandle`. Re-enable once react-native-pulsar is released with it.
    run: cd react-native/react-native-pulsar-lottie && npx tsc --noEmit
    paths: ["react-native/react-native-pulsar-lottie/src/**"]
    required: false
    timeout_s: 300
    parse: exit

  # --- web/Pulsar (pulsar-haptics web SDK) ---
  - id: web-typecheck
    kind: typecheck
    run: cd web/Pulsar && npm run typecheck --silent
    paths: ["web/Pulsar/**/*.{ts,tsx,js,mjs}", "web/Pulsar/tsconfig*.json"]
    required: true
    quick: true
    timeout_s: 300
    parse: exit
  - id: web-unit
    kind: unit
    run: cd web/Pulsar && npm test --silent
    paths: ["web/Pulsar/**"]
    required: true
    quick: true
    timeout_s: 300
    parse: exit

  # --- tools/pulsar-gen ---
  - id: gen-typecheck
    kind: typecheck
    run: cd tools/pulsar-gen && npm run typecheck --silent
    paths: ["tools/pulsar-gen/**"]
    required: true
    quick: true
    timeout_s: 300
    parse: exit
  - id: gen-unit
    kind: unit
    run: cd tools/pulsar-gen && npm test --silent
    paths: ["tools/pulsar-gen/**"]
    required: true
    quick: true
    timeout_s: 300
    parse: exit

  # --- native SDKs ---
  - id: android-unit
    kind: unit
    run: cd Android/PulsarApp && ./gradlew :Pulsar:testDebugUnitTest --console=plain
    env:
      JAVA_HOME: /Applications/Android Studio.app/Contents/jbr/Contents/Home
    paths: ["Android/Pulsar/**"]
    required: true
    timeout_s: 1200
    parse: exit
    evidence:
      - { kind: test-report, glob: Android/Pulsar/build/reports/tests/testDebugUnitTest/index.html }
  - id: ios-unit
    kind: unit
    run: .factory/verification/checks/ios-sdk-tests.sh
    paths: ["iOS/Pulsar/Sources/**", "iOS/Pulsar/Tests/**", "iOS/Pulsar/Package.swift"]
    required: true
    timeout_s: 1800
    parse: exit
    evidence:
      - { kind: test-report, glob: .factory-out/ios-sdk-tests.log }
  - id: flutter-unit
    kind: unit
    run: .factory/verification/checks/flutter-test.sh flutter/pulsar
    paths: ["flutter/pulsar/lib/**", "flutter/pulsar/test/**", "flutter/pulsar/pubspec.yaml"]
    required: true
    timeout_s: 600
    parse: exit
  - id: flutter-lottie-unit
    kind: unit
    run: .factory/verification/checks/flutter-test.sh flutter/PulsarLottie
    paths: ["flutter/PulsarLottie/lib/**", "flutter/PulsarLottie/test/**", "flutter/PulsarLottie/pubspec.yaml"]
    required: true
    timeout_s: 600
    parse: exit
  - id: kmp-unit
    kind: unit
    run: cd kmp/Pulsar && ./gradlew :library:allTests --console=plain
    env:
      JAVA_HOME: /Applications/Android Studio.app/Contents/jbr/Contents/Home
    paths: ["kmp/Pulsar/library/**", "kmp/Pulsar/*.gradle.kts", "kmp/Pulsar/gradle/**"]
    required: true
    timeout_s: 1200
    parse: exit

  # --- native lint (changed files only; main has ~6.5k ktlint and ~1k swiftlint violations, CI enforces neither) ---
  - id: ktlint
    kind: lint
    run: .factory/verification/checks/native-lint-changed.sh kotlin
    paths: ["**/*.kt"]
    required: false
    quick: true
    timeout_s: 300
    parse: exit
  - id: swiftlint
    kind: lint
    run: .factory/verification/checks/native-lint-changed.sh swift
    paths: ["**/*.swift"]
    required: false
    quick: true
    timeout_s: 300
    parse: exit

  # --- device e2e: no saved suite in this repo yet. Enable (required: false) once argent flows exist. ---
  - id: e2e
    kind: e2e
    enabled: false
    setup: .factory/verification/checks/boot-simulator.sh
    run: "echo 'no e2e suite configured' && exit 1"
    paths: ["react-native/PulsarApp/**", "iOS/PulsarApp/**", "Android/PulsarApp/app/**"]
    required: false
    timeout_s: 2400
    parse: exit
  - id: mutation
    kind: mutation
    enabled: false
    run: .factory/verification/checks/mutation.sh
    paths: ["react-native/react-native-pulsar/src/**"]
    required: false
    timeout_s: 1800
    parse: json
    evidence:
      - { kind: mutation-report, glob: .factory-out/mutation.json }
coverage:
  format: lcov
  path: .factory-out/rn-coverage/lcov.info
  threshold: 0
  required: false
path_classes:
  src:
    - "**/*.kt"
    - "**/*.swift"
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"
    - "**/*.jsx"
    - "**/*.mjs"
    - "**/*.java"
  tests:
    - "**/*.test.*"
    - "**/*Test.kt"
    - "**/*Tests.swift"
    - "**/*_test.dart"
    - "**/src/test/**"
    - "**/src/commonTest/**"
    - "**/Tests/**"
    - "**/test/**"
    - "**/*.spec.*"
    - test/**
    - tests/**
    - "**/__tests__/**"
    - "**/test_*.py"
    - "**/*_test.py"
    - "**/*_test.go"
    - e2e/**
  ci:
    - .github/**
    - .gitlab-ci.yml
    - .circleci/**
    - Jenkinsfile
    - azure-pipelines.yml
  lint_config:
    - "**/.eslintrc*"
    - "**/eslint.config.*"
    - "**/.swiftlint.yml"
    - "**/.editorconfig"
    - "**/analysis_options.yaml"
    - .eslintrc*
    - eslint.config.*
    - biome.json
    - biome.jsonc
    - .prettierrc*
    - prettier.config.*
    - tsconfig*.json
    - ruff.toml
    - .ruff.toml
    - .flake8
    - mypy.ini
    - pyrightconfig.json
    - .golangci.*
    - .tflint.hcl
  test_config:
    - "**/jest.config.*"
    - "**/jest-mock.js"
    - vitest.config.*
    - jest.config.*
    - playwright.config.*
    - cypress.config.*
    - .detoxrc*
    - pytest.ini
    - .mocharc*
    - package.json#scripts.test
  snapshots:
    - "**/__snapshots__/**"
    - "**/*.snap"
  manifests:
    - package.json
    - pyproject.toml
    - go.mod
    - Cargo.toml
    - Gemfile
    - Podfile
    - "**/build.gradle*"
  lockfiles:
    - package-lock.json
    - pnpm-lock.yaml
    - yarn.lock
    - bun.lockb
    - bun.lock
    - uv.lock
    - poetry.lock
    - go.sum
    - Cargo.lock
    - Podfile.lock
    - "**/*.lock"
  migrations:
    - migrations/**
    - "**/migrations/**"
  public_api: []
  ui:
    - "react-native/PulsarApp/**/*.tsx"
    - "iOS/PulsarApp/**/*.swift"
    - "Android/PulsarApp/app/**/*.kt"
    - "flutter/PulsarApp/lib/**"
    - "kmp/PulsarApp/**/*.kt"
    - "web/PulsarApp/src/**"
    - "docs/src/**"
    - "**/res/layout/**"
  docs:
    - "**/*.md"
    - docs/**
  generated:
    - "**/generated/**"
    - "react-native/*/lib/**"
    - "**/.build/**"
    - "**/.tmp/**"
    - dist/**
    - build/**
    - "**/*.generated.*"
  protected:
    - .factory/policy/**
    - .factory/verification/**
diff_guard:
  rules:
    - test-deleted
    - assertions-removed
    - skip-added
    - only-added
    - suppression-added
    - ci-modified
    - test-config-modified
    - lint-config-modified
    - coverage-threshold-lowered
    - snapshot-updated
    - expected-value-changed
    - protected-path-modified
  skip_patterns:
    - \b(it|test|describe)\.skip\(
    - \bx(it|describe|test)\(
    - "@pytest\\.mark\\.(skip|xfail)"
    - \bt\.Skip\(
    - "#\\[ignore\\]"
  only_patterns:
    - \b(it|test|describe)\.only\(
    - \bf(it|describe)\(
  suppression_patterns:
    - eslint-disable
    - "@ts-ignore"
    - "@ts-expect-error"
    - "@ts-nocheck"
    - biome-ignore
    - "# noqa"
    - "# type: ignore"
    - //\s*nolint
    - istanbul ignore
    - c8 ignore
    - "pragma: no cover"
    - "#\\[allow\\("
  assertion_patterns:
    - \bexpect\(
    - \bassert
    - \.should\b
    - \bassertEquals\(
    - \bt\.(Error|Fatal)
    - \brequire\.
    - \bassert_eq!
repro:
  required_for:
    - bug
  timeout_s: 600
evidence_required:
  - kind: test-report
    when_paths:
      - react-native/react-native-pulsar/src/**
      - Android/Pulsar/src/main/**
      - iOS/Pulsar/Sources/**
  # Screenshots only for the example/demo apps; SDK code has no UI of its own.
  - kind: screenshot
    when_paths:
      - react-native/PulsarApp/**/*.tsx
      - iOS/PulsarApp/**/*.swift
      - Android/PulsarApp/app/**/*.kt
      - flutter/PulsarApp/lib/**
